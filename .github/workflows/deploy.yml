name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EasyPanel deploy
        run: curl --fail --silent --show-error -X POST "$EASYPANEL_DEPLOY_HOOK"
        env:
          EASYPANEL_DEPLOY_HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK }}
